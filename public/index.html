    window.leafletListo = new Promise(function (resolve) {
      function cargar(src, fallback) {
        var s = document.createElement('script');
        s.src = src;
        s.onload = function () { resolve(!!window.L); };
        s.onerror = function () { fallback ? cargar(fallback) : resolve(false); };
        document.head.appendChild(s);
      }
      cargar('/vendor/leaflet/leaflet.js', 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js');
    });
